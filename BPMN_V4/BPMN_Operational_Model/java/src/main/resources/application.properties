spring.application.name=Hospital Referral
camunda.client.mode=self-managed
camunda.client.grpc-address=http://127.0.0.1:26500
camunda.client.rest-address=http://127.0.0.1:8080
logging.level.io.camunda.client.impl.CamundaCallCredentials=ERROR
spring.datasource.url=jdbc:h2:file:./data/hospital-referral;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

